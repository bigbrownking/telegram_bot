# Application
spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}
server.address=${SERVER_ADDRESS}

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false


# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Telegram bots
tg.user.token=${USER_BOT_TOKEN}
tg.user.username=${USER_BOT_NAME}
tg.admin.token=${ADMIN_BOT_TOKEN}
tg.admin.username=${ADMIN_BOT_NAME}

logging.level.org.info.tg_bot.service.DocumentParserService= DEBUG

# scheduler
scheduler.overdue-check.cron=${OVERDUE}
scheduler.upcoming-check.cron=${UPCOMING}
scheduler.temp-cleaner.cron=${TEMP_DELETE}

secret.key=${SECRET_KEY}