# Application
spring.application.name=tg-bot-document-management

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/tg
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false


# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Telegram bots
tg.user.token=${USER_BOT_TOKEN}
tg.user.username=afm_rk_bot
tg.admin.token=${ADMIN_BOT_TOKEN}
tg.admin.username=afm_rk_admin_bot



# Notifications
notification.enabled=true
notification.retry.max-attempts=3
notification.retry.delay-ms=5000
notification.schedule.days-before.first=5
notification.schedule.days-before.second=3
notification.schedule.days-before.third=1
notification.schedule.days-before.execution-day=0

# Scheduler
scheduler.enabled=true
scheduler.cron.notifications=0 */30 * * * *
scheduler.cron.overdue-check=0 0 9 * * *
scheduler.cron.cleanup=0 0 2 * * *